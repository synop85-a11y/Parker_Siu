<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="파커-시우 · 시즌2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#F2F4F6">
<title>파커-시우 · 시즌2 위인관</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   디자인 토큰
   ------------------------------------------------------------
   밝은 카카오풍이 기본. 위인 도감/가챠만 '짙은 섬(dark island)'으로
   남겨서 금색 카드 아트가 흰 배경에 뜨지 않게 한다.
   색을 바꾸려면 여기만 고치면 된다.
   ============================================================ */
:root {
  /* 라이트 */
  --bg:         #F2F4F6;
  --surface:    #FFFFFF;
  --surface-2:  #F9FAFB;
  --surface-3:  #EEF1F4;
  --line:       #E5E8EB;
  --line-2:     #D1D6DB;
  --text:       #191F28;
  --text-2:     #6B7684;
  --text-3:     #8B95A1;

  --primary:    #FEE500;   /* 카카오 옐로우 */
  --primary-d:  #F2D900;
  --on-primary: #191600;
  --accent:     #3182F6;
  --accent-d:   #1B64DA;
  --success:    #00C471;
  --success-bg: #E7F9F0;
  --danger:     #F04452;
  --danger-bg:  #FEECEE;

  --r-sm: 12px;
  --r:    16px;
  --r-lg: 20px;
  --r-xl: 28px;

  --sh-1: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.05);
  --sh-2: 0 2px 4px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.07);
  --sh-3: 0 8px 40px rgba(0,0,0,.12);
  --sh-primary: 0 4px 14px rgba(254,229,0,.45);

  /* 짙은 섬 (도감 / 가챠 / 카드 연출) */
  --d-bg:      #101E3C;
  --d-bg-2:    #0A1A38;
  --d-surface: linear-gradient(180deg, #1B305B 0%, #0A1A38 100%);
  --d-line:    #C6961F;
  --d-line-2:  rgba(198,150,31,.35);
  --d-text:    #F5E4B0;
  --d-text-2:  #C9A85A;
  --d-gold:    #F0C662;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

html, body {
  width:100%; height:100%; overflow:hidden;
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-touch-callout:none; touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}

#app { width:100vw; height:100vh; position:relative; overflow:hidden; z-index:1; }

.screen {
  position:absolute; inset:0; display:none; flex-direction:column;
  padding:2.5vh 3vw; z-index:2;
}
.screen.active { display:flex; }
.screen.entering { animation:slideIn 0.32s cubic-bezier(.16,1,.3,1); }
@keyframes slideIn {
  from { opacity:0; transform:translateY(1.5vh); }
  to   { opacity:1; transform:translateY(0); }
}

.gold { color:var(--accent); }

/* ============== 헤더 ============== */
.header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:2vh; min-height:8vh; gap:1.5vh;
  /* 우상단 사운드 토글(absolute)과 겹치지 않게 자리를 비워둔다 */
  padding-right:7.5vh;
}
.btn-back {
  background:var(--surface); color:var(--text);
  border:1px solid var(--line);
  width:6.4vh; height:6.4vh; border-radius:50%;
  font-size:3vh; font-weight:700; cursor:pointer; font-family:inherit;
  box-shadow:var(--sh-1);
  display:flex; align-items:center; justify-content:center;
  transition:transform .12s ease, background .12s ease;
}
.btn-back:active { transform:scale(.92); background:var(--surface-3); }

.stars-display {
  background:var(--surface); color:var(--text);
  border:1px solid var(--line);
  padding:1.1vh 2.2vh; border-radius:99px;
  font-size:2.6vh; font-weight:800;
  font-family:'Nunito', 'Pretendard', sans-serif;
  box-shadow:var(--sh-1);
  display:flex; align-items:center; gap:1vh; min-width:11vh; justify-content:center;
}

/* ============== 홈 ============== */
#screen-home {
  align-items:center; justify-content:flex-start; padding-top:2.5vh;
}
.home-top-bar {
  position:absolute; top:2.5vh; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:1.2vh; z-index:10;
}
.home-action-btn {
  background:var(--primary); color:var(--on-primary);
  padding:1.3vh 2.6vh; border-radius:99px;
  font-size:2.5vh; font-weight:800; font-family:inherit;
  border:none; box-shadow:var(--sh-primary);
  cursor:pointer;
  display:flex; align-items:center; gap:1vh;
  transition:transform .12s ease, box-shadow .12s ease;
}
.home-action-btn:active { transform:scale(.95); box-shadow:0 2px 6px rgba(254,229,0,.4); }
.home-action-btn.gacha { background:var(--primary); color:var(--on-primary); }
/* 도감 버튼은 들어갈 화면(짙은 섬)을 미리 보여준다 */
.home-action-btn.dex {
  background:var(--d-bg); color:var(--d-text);
  box-shadow:0 4px 14px rgba(16,30,60,.28);
}
.home-action-btn.dex:active { box-shadow:0 2px 6px rgba(16,30,60,.3); }
.home-action-btn .badge {
  background:rgba(255,255,255,.22); color:var(--d-text);
  padding:0.35vh 1.1vh; border-radius:99px;
  font-size:2.1vh; font-weight:800; min-width:3vh; text-align:center;
}
.home-action-btn.gacha .badge { background:rgba(0,0,0,.12); color:var(--on-primary); }
.reset-corner-btn {
  position:absolute; bottom:2vh; right:2vh;
  width:4.6vh; height:4.6vh; border-radius:50%;
  background:var(--surface); border:1px solid var(--line);
  font-size:2.1vh; color:var(--text-3);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-family:inherit; z-index:5;
  box-shadow:var(--sh-1);
}
.reset-corner-btn:active { background:var(--surface-3); transform:scale(.92); }
.home-title-wrap {
  margin-top:7vh; margin-bottom:2vh; text-align:center;
}
.home-title {
  font-size:5.2vh; font-weight:900; color:var(--text);
  letter-spacing:-0.02em;
}
.home-subtitle {
  font-size:2.3vh; color:var(--text-2); margin-top:0.8vh; font-weight:500;
}

/* 전체 완성도 (다 푼 문제) */
.overall-progress {
  display:flex; align-items:center; gap:1.4vh;
  margin-top:1.6vh; width:52vw; max-width:min(52vw, 720px);
}
.overall-progress-bar {
  flex:1; height:1.4vh;
  background:var(--surface-3);
  border-radius:99px; overflow:hidden;
}
.overall-progress-fill {
  height:100%; width:0;
  background:var(--primary);
  border-radius:99px;
  transition:width 0.6s cubic-bezier(.16,1,.3,1);
}
.overall-progress-text {
  font-size:1.9vh; color:var(--text-2); font-weight:700;
  white-space:nowrap;
}

/* 세션 카드 그리드 */
/* 세션 6개(단어/파닉스/문장/단어가족/말하기/쓰기) -> 가로 3x2 로 딱 맞는다. 세로는 1열. */
.session-grid {
  display:grid; grid-template-columns:repeat(3, 1fr); grid-auto-rows:1fr;
  gap:1.8vh 1.6vw; width:100%; max-width:min(90vw, 1300px); margin-top:1.6vh; flex:1; max-height:65vh;
}
.session-card {
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:2.2vh 2.4vh;
  cursor:pointer;
  box-shadow:var(--sh-1);
  transition:transform .14s ease, box-shadow .14s ease;
  display:flex; flex-direction:row; align-items:center; gap:2vh;
  position:relative; overflow:hidden;
  min-height:12vh;
}
.session-card:active { transform:scale(.975); box-shadow:var(--sh-2); }
.session-emoji {
  font-size:5.6vh; line-height:1; flex-shrink:0;
  width:9.5vh; height:9.5vh; border-radius:var(--r);
  background:var(--surface-2);
  display:flex; align-items:center; justify-content:center;
}
.session-info { flex:1; display:flex; flex-direction:column; gap:0.5vh; min-width:0; }
.session-name { font-size:2.9vh; font-weight:800; color:var(--text); line-height:1.15; letter-spacing:-0.01em; }
.session-sub  { font-size:1.9vh; color:var(--text-3); line-height:1.35; font-weight:500; }
.session-progress {
  display:flex; align-items:center; gap:1vh; margin-top:0.7vh;
}
.session-progress-bar {
  flex:1; height:0.9vh;
  background:var(--surface-3);
  border-radius:99px; overflow:hidden;
}
.session-progress-fill {
  height:100%;
  background:var(--primary);
  border-radius:99px;
  transition:width 0.5s cubic-bezier(.16,1,.3,1);
}
.session-progress-text { font-size:1.6vh; color:var(--text-3); min-width:5vh; text-align:right; font-weight:600; }

/* ============== 시험 보기 버튼 (홈) ============== */
.exam-start-btn {
  margin-top:1.8vh; width:100%; max-width:min(85vw, 1150px);
  display:flex; align-items:center; justify-content:center; gap:2vh;
  background:var(--text); border:none;
  border-radius:var(--r-lg); padding:2vh 3vh; cursor:pointer;
  box-shadow:var(--sh-2);
  font-family:inherit; color:#fff;
  transition:transform .14s ease, box-shadow .14s ease;
}
.exam-start-btn:active { transform:scale(.98); box-shadow:var(--sh-1); }
.exam-start-emoji { font-size:4.2vh; line-height:1; }
.exam-start-text { display:flex; flex-direction:column; align-items:flex-start; gap:0.2vh; }
.exam-start-name { font-size:2.8vh; font-weight:800; color:#fff; letter-spacing:-0.01em; }
.exam-start-sub  { font-size:1.8vh; color:rgba(255,255,255,.62); font-weight:500; }

/* ============== 시험 결과 ============== */
.exam-result-box {
  background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r-xl);
  padding:3.5vh 4vh; text-align:center;
  box-shadow:var(--sh-3);
  max-width:80vw; max-height:92vh; overflow-y:auto;
  display:flex; flex-direction:column; align-items:center; gap:0.9vh;
}
.exam-grade-icon { font-size:8vh; line-height:1; }
.exam-score {
  font-size:6.4vh; font-weight:900; color:var(--text); line-height:1.1;
  font-family:'Nunito','Pretendard',sans-serif;
}
.exam-grade-title { font-size:3.2vh; font-weight:800; color:var(--text); }
.exam-detail { font-size:2.1vh; color:var(--text-3); font-weight:500; }
.exam-msg { font-size:2.3vh; color:var(--text-2); margin-bottom:0.6vh; font-weight:500; }
.exam-note-btn {
  margin-top:1.2vh; background:var(--surface-2); border:1px solid var(--line);
  color:var(--text-2); font-family:inherit; font-size:2vh; font-weight:700;
  padding:1.2vh 2.5vh; border-radius:99px; cursor:pointer;
}
.exam-note-btn:active { background:var(--surface-3); transform:scale(.97); }
.exam-note {
  width:100%; margin-top:1.4vh; max-height:32vh; overflow-y:auto;
  background:var(--surface-2); border-radius:var(--r); padding:0.6vh 1.2vh;
}
.exam-note-row {
  display:flex; flex-direction:column; gap:0.4vh;
  padding:1.4vh 0.6vh; border-bottom:1px solid var(--line);
  text-align:left;
}
.exam-note-row:last-child { border-bottom:none; }
.exam-note-q { font-size:2vh; color:var(--text); font-weight:700; }
.exam-note-ans { display:flex; gap:2vh; font-size:1.85vh; flex-wrap:wrap; font-weight:600; }
.exam-note-ans .mine  { color:var(--danger); }
.exam-note-ans .right { color:var(--success); font-weight:800; }

/* ============== 스피킹 문제 ============== */
.speak-box {
  display:flex; flex-direction:column; align-items:center; gap:2vh;
  padding:2vh; width:100%;
}
.speak-word.sentence { font-size:3.6vh; line-height:1.35; max-width:80vw; }
.speak-word {
  font-size:5.6vh; font-weight:900; color:var(--text);
  font-family:'Nunito','Pretendard',sans-serif; letter-spacing:0.02em;
}
.speak-btns { display:flex; gap:2vh; flex-wrap:wrap; justify-content:center; }
.speak-hint { font-size:1.95vh; color:var(--text-3); font-weight:500; }
.speak-hint.warn { color:var(--danger); font-weight:700; }
.btn-action.recording {
  background:var(--danger); color:#fff;
  animation:recPulse 1s infinite;
}
@keyframes recPulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

/* ============== 부모 채점 ============== */
.grade-list {
  width:100%; margin-top:1.5vh; max-height:46vh; overflow-y:auto;
  background:var(--surface-2); border-radius:var(--r); padding:1vh;
}
.grade-row {
  display:flex; flex-direction:column; gap:1vh;
  padding:1.6vh; border-bottom:1px solid var(--line);
  border-radius:var(--r-sm);
}
.grade-row:last-child { border-bottom:none; }
.grade-row.graded-ok { background:var(--success-bg); }
.grade-row.graded-no { background:var(--danger-bg); }
.grade-word { font-size:2.8vh; font-weight:800; color:var(--text); }
.grade-btns { display:flex; gap:1.2vh; flex-wrap:wrap; }
.grade-btns button {
  font-family:inherit; font-size:1.85vh; font-weight:700;
  padding:1.1vh 2vh; border-radius:99px; cursor:pointer;
  border:1px solid var(--line-2); background:var(--surface); color:var(--text-2);
}
.grade-btns button:disabled { opacity:0.4; cursor:default; }
.grade-btns .grade-ok { border-color:var(--success); color:var(--success); }
.grade-btns .grade-no { border-color:var(--danger); color:var(--danger); }

/* 시험 중 고른 보기 (정답 여부는 안 알려줌) */
.choice.picked {
  background:var(--accent); border-color:var(--accent); color:#fff;
  transform:scale(.97);
}

/* ============== 세션 인트로 오버레이 ============== */
.intro-overlay {
  position:fixed; inset:0; background:rgba(255,255,255,.94);
  display:none; align-items:center; justify-content:center; z-index:1500;
  backdrop-filter:blur(8px);
}
.intro-overlay.show { display:flex; animation:fadeIn 0.25s ease-out; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
.intro-content {
  text-align:center; animation:popIn 0.42s cubic-bezier(.16,1,.3,1);
}
@keyframes popIn { 0%{transform:scale(.7);opacity:0;} 100%{transform:scale(1);opacity:1;} }
.intro-emoji { font-size:15vh; margin-bottom:2vh; }
.intro-text {
  font-size:4.6vh; font-weight:900; color:var(--text); letter-spacing:-0.02em;
}
.intro-hint { margin-top:1.6vh; font-size:2.4vh; color:var(--text-2); font-weight:500; }

/* ============== 퀴즈 ============== */
#screen-quiz { justify-content:space-between; }
.quiz-header { display:flex; justify-content:space-between; align-items:center; }
.progress-bar {
  flex:1; margin:0 3vw; height:1.4vh;
  background:var(--surface-3);
  border-radius:99px; overflow:hidden;
}
.progress-bar-fill {
  height:100%;
  background:var(--primary);
  border-radius:99px;
  transition:width 0.4s cubic-bezier(.16,1,.3,1);
}
.quiz-content {
  flex:1; display:flex; flex-direction:column;
  justify-content:center; align-items:center; gap:4vh;
}
.question-box {
  background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r-xl);
  padding:3.5vh 5vw;
  box-shadow:var(--sh-1);
  min-width:min(40vw, 620px); text-align:center;
}
.question-prompt { font-size:2.3vh; color:var(--text-3); margin-bottom:1.8vh; font-weight:600; }
.question-content { font-size:10vh; font-weight:800; color:var(--text); }
.question-content.text {
  font-family:'Nunito','Pretendard',sans-serif;
  font-size:7.5vh; letter-spacing:0.02em;
}
.question-content.sentence {
  font-family:'Nunito','Pretendard',sans-serif;
  font-size:4.5vh; letter-spacing:0; line-height:1.4;
}
/* 빈칸 문장에서 정답을 하나로 확정해 주는 그림 */
.question-image {
  display:block; margin:0 auto 2vh;
  height:22vh; max-width:60vw; object-fit:contain;
  border-radius:var(--r); border:1px solid var(--line);
  background:var(--surface-2);
}
.question-image[hidden] { display:none; }
/* 그림 파일이 아직 없으면 이모지로 대체 */
.question-emoji-fallback {
  font-size:14vh; line-height:1.1; margin-bottom:1vh;
}
.choices {
  display:grid; grid-template-columns:repeat(4, 1fr);
  gap:1.6vw; width:90vw; max-width:1250px;
}
.choice {
  background:var(--surface);
  color:var(--text);
  border:2px solid var(--line); border-radius:var(--r-lg);
  padding:3vh 2vh; cursor:pointer;
  box-shadow:var(--sh-1);
  display:flex; align-items:center; justify-content:center;
  min-height:14vh; font-size:5.5vh; font-weight:800; font-family:inherit;
  transition:transform .14s ease, border-color .14s ease, background .14s ease;
}
.choice.text { font-family:'Nunito', 'Pretendard', sans-serif; font-size:4vh; }
/* 그림 보기 — 버튼 안을 그림이 채운다 */
.choice.img { padding:1.2vh; min-height:20vh; }
.choice.img img { width:100%; height:100%; max-height:22vh; object-fit:contain; border-radius:var(--r-sm); }
.choice:active { transform:scale(.96); border-color:var(--line-2); background:var(--surface-2); }
.choice.correct { background:var(--success); border-color:var(--success); color:#fff; animation:correctPulse 0.5s; }
.choice.wrong   { background:var(--danger);  border-color:var(--danger);  color:#fff; animation:wrongShake 0.4s; }
.choice.disabled { pointer-events:none; opacity:0.45; }
@keyframes correctPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
@keyframes wrongShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-1vw);} 75%{transform:translateX(1vw);} }

.quiz-stars {
  position:absolute; top:8vh; right:3vh;
  background:var(--surface); border:1px solid var(--line); color:var(--text);
  padding:0.9vh 1.9vh; border-radius:99px;
  font-size:2.4vh; font-weight:800;
  font-family:'Nunito','Pretendard',sans-serif;
  box-shadow:var(--sh-1);
  display:flex; align-items:center; gap:0.8vh; z-index:5;
}
.quiz-stars.bump { animation:starBump 0.5s ease-out; }
@keyframes starBump { 0%{transform:scale(1);} 40%{transform:scale(1.3);} 100%{transform:scale(1);} }

.flying-star {
  position:fixed; pointer-events:none; z-index:1000;
  font-size:5vh; animation:flyToTop 0.9s ease-in forwards;
}
@keyframes flyToTop {
  0%   { opacity:1; transform:scale(1.5) rotate(0deg); }
  50%  { opacity:1; transform:scale(1) rotate(180deg); }
  100% { opacity:0; transform:scale(0.3) rotate(360deg) translate(20vh, -40vh); }
}

.bonus-toast {
  position:fixed; top:12vh; left:50%; transform:translateX(-50%);
  background:var(--text);
  color:#fff; padding:1.5vh 3vh; border-radius:99px;
  font-size:2.6vh; font-weight:800;
  box-shadow:var(--sh-3);
  z-index:1100; animation:bonusToast 1.8s ease-out forwards;
}
@keyframes bonusToast {
  0% { opacity:0; transform:translate(-50%, -3vh); }
  20%,80% { opacity:1; transform:translate(-50%, 0); }
  100% { opacity:0; transform:translate(-50%, -3vh); }
}

/* ============== 쓰기 ============== */
#screen-writing { padding:2.5vh 3vw; align-items:center; }
.writing-content {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  width:100%; padding:1vh 2vh; gap:2vh;
}
.writing-prompt {
  font-size:3vh; color:var(--text); font-weight:800;
  background:var(--surface);
  padding:1.3vh 3vh; border-radius:99px;
  border:1px solid var(--line);
  box-shadow:var(--sh-1);
}
/* 그림/문장 제시 영역 */
.writing-visual {
  display:flex; align-items:center; justify-content:center;
  gap:2vh; min-height:22vh;
}
.writing-visual img {
  height:22vh; max-width:52vw; object-fit:contain;
  filter:drop-shadow(0 .4vh .8vh rgba(0,0,0,.12));
}
.writing-visual .writing-emoji { font-size:18vh; line-height:1; }
.writing-sentence {
  font-size:4.2vh; font-weight:800; color:var(--text);
  font-family:'Nunito','Pretendard',sans-serif;
  text-align:center; letter-spacing:.02em;
}
.writing-sentence .blank {
  display:inline-block; min-width:5em;
  border-bottom:.5vh solid var(--text);
  margin:0 .2em;
}

/* 4선 3칸 필기 영역 */
.writing-paper {
  position:relative;
  width:76vh; height:26vh; max-width:94vw;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-xl);
  box-shadow:var(--sh-2);
  overflow:hidden;
}
.writing-paper canvas {
  position:absolute; top:0; left:0; width:100%; height:100%;
}
#writingGuideCanvas { pointer-events:none; }
#writingCanvas { cursor:crosshair; touch-action:none; }
.writing-buttons { display:flex; gap:2vh; flex-wrap:wrap; justify-content:center; }
.writing-judge { display:flex; gap:2vh; }
.writing-judge .btn-action { font-size:2.6vh; }

/* ============== 결과 ============== */
#screen-result { align-items:center; justify-content:center; }
.result-box {
  background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r-xl);
  padding:5vh 7vw; text-align:center;
  box-shadow:var(--sh-3);
  max-width:70vw;
}
.result-title { font-size:5vh; font-weight:900; color:var(--text); margin-bottom:2vh; letter-spacing:-0.02em; }
.result-stars-icon { font-size:7.5vh; letter-spacing:1vh; margin-bottom:2vh; }
.result-score { font-size:3.4vh; color:var(--text-2); margin-bottom:2vh; font-weight:600; }
.result-earned {
  font-size:2.6vh; color:var(--text-2); margin-top:1vh; display:flex;
  align-items:center; justify-content:center; gap:1vh; font-weight:600;
}
.result-earned .big { font-size:4.2vh; font-weight:900; color:var(--text); font-family:'Nunito','Pretendard',sans-serif; }
.result-buttons { display:flex; gap:2vw; justify-content:center; margin-top:3vh; flex-wrap:wrap; }
.btn-action {
  background:var(--surface); color:var(--text);
  border:1px solid var(--line-2); padding:1.9vh 3.5vw;
  font-size:2.6vh; font-weight:800; font-family:inherit;
  border-radius:99px; cursor:pointer;
  box-shadow:var(--sh-1);
  transition:transform .14s ease, background .14s ease;
}
.btn-action.primary { background:var(--primary); color:var(--on-primary); border-color:transparent; box-shadow:var(--sh-primary); }
.btn-action:active { transform:scale(.96); background:var(--surface-2); }
.btn-action.primary:active { background:var(--primary-d); }

/* ============================================================
   짙은 섬 — 가챠 / 도감 / 카드 연출
   금색 카드 아트가 흰 배경에서 뜨지 않도록 이 영역만 어둡게 유지한다.
   ============================================================ */
#screen-gacha {
  align-items:center; justify-content:center; gap:3vh;
  background:linear-gradient(160deg, #101E3C 0%, #16294F 50%, #0A1A38 100%);
}
#screen-gacha .btn-back { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.2); color:var(--d-text); }
#screen-gacha .stars-display { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.2); color:var(--d-text); }
.gacha-machine {
  width:32vh; height:32vh; border-radius:50%;
  background: radial-gradient(circle at 30% 30%, #F5E4B0 0%, #C6961F 40%, #6A4210 100%);
  border:0.8vh solid #F5E4B0;
  box-shadow: 0 1vh 4vh rgba(0,0,0,0.5), 0 0 6vh rgba(240,198,98,0.35);
  display:flex; align-items:center; justify-content:center;
  font-size:16vh; animation:machineFloat 3s ease-in-out infinite;
}
@keyframes machineFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-2vh);} }
.gacha-machine.shaking { animation:gachaShake 0.4s ease-in-out 3; }
@keyframes gachaShake {
  0%,100% { transform:translateX(0) rotate(0); }
  25%     { transform:translateX(-2vh) rotate(-6deg); }
  75%     { transform:translateX(2vh) rotate(6deg); }
}
.gacha-pull-btn {
  background:var(--primary); color:var(--on-primary);
  border:none; padding:2.2vh 5vw;
  border-radius:99px; font-size:3vh; font-weight:800; font-family:inherit;
  box-shadow: 0 6px 24px rgba(254,229,0,.4);
  cursor:pointer;
  display:flex; align-items:center; gap:1.5vh;
  transition:transform .14s ease, box-shadow .14s ease;
}
.gacha-pull-btn:active { transform:scale(.96); box-shadow:0 3px 12px rgba(254,229,0,.35); }
.gacha-pull-btn:disabled {
  background:rgba(255,255,255,.14); color:rgba(245,228,176,.45);
  box-shadow:none; cursor:not-allowed;
}
.gacha-info { font-size:2.2vh; color:var(--d-text-2); text-align:center; line-height:1.5; font-weight:500; }

.card-reveal-overlay {
  position:fixed; inset:0; background:rgba(6,12,26,.94);
  display:none; align-items:center; justify-content:center; z-index:2000;
  backdrop-filter:blur(4px);
}
.card-reveal-overlay.show { display:flex; }
.card-reveal { display:flex; flex-direction:column; align-items:center;
  animation:revealPop 0.6s cubic-bezier(.16,1,.3,1); }
@keyframes revealPop {
  0% { opacity:0; transform:scale(0.4) rotate(-10deg); }
  60% { transform:scale(1.06) rotate(3deg); }
  100% { opacity:1; transform:scale(1) rotate(0); }
}
.reveal-card {
  width:36vh; min-height:44vh;
  background:
    radial-gradient(circle at 50% 20%, rgba(240,198,98,0.22) 0%, transparent 60%),
    var(--d-surface);
  border:0.5vh solid var(--d-gold); border-radius:var(--r-xl);
  padding:3vh 2.5vh 2.5vh;
  display:flex; flex-direction:column; align-items:center;
  justify-content:flex-start; gap:2.5vh;
  box-shadow: 0 0 6vh rgba(240,198,98,0.35), 0 2vh 5vh rgba(0,0,0,0.55);
  position:relative;
}
.reveal-img {
  width:26vh; height:26vh; object-fit:contain;
  border-radius:var(--r); box-shadow: 0 0.6vh 2vh rgba(0,0,0,0.5); background:var(--d-bg-2);
}
.reveal-status-group {
  display:flex; flex-direction:column; align-items:center; gap:0.8vh;
}
.reveal-status {
  font-size:2.4vh; color:var(--d-text);
  background:rgba(245,228,176,0.15); padding:1vh 2.5vh; border-radius:99px; font-weight:700;
}
.reveal-status.new { background:var(--success); color:#fff; }
.reveal-status.dup { background:rgba(255,255,255,.16); color:rgba(245,228,176,.8); }
.reveal-refund { font-size:2.2vh; color:var(--d-gold); font-weight:700; }
.reveal-tap-hint {
  margin-top:auto; color:var(--d-gold); font-size:2vh;
  animation:blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

/* ============== 도감 ============== */
#screen-dex {
  padding:0;
  background:linear-gradient(180deg, #101E3C 0%, #0C1A36 100%);
}
#screen-dex .btn-back { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.2); color:var(--d-text); }
.dex-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:2.5vh 3vh; width:100%; gap:2vh;
  /* 오른쪽은 사운드 토글(absolute, right:3vw/width:6vh) 자리를 비워둔다 */
  padding-right:calc(3vw + 8vh);
}
.dex-title { font-size:3.4vh; color:var(--d-text); font-weight:900; letter-spacing:-0.01em; }
.dex-progress {
  background:var(--primary);
  color:var(--on-primary); padding:1vh 2vh; border-radius:99px;
  font-size:2.3vh; font-weight:800;
  font-family:'Nunito','Pretendard',sans-serif;
}
.dex-tabs {
  display:flex; gap:0.8vh; width:100%;
  padding:0 max(3vh, calc((100% - 1500px) / 2));
  overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none;
}
.dex-tabs::-webkit-scrollbar { display:none; }
.dex-tab {
  padding:1.2vh 2vh; background:rgba(255,255,255,.09);
  color:var(--d-text-2); border-radius:99px;
  cursor:pointer; font-family:inherit; font-size:2.1vh; font-weight:700;
  border:none; white-space:nowrap; flex-shrink:0;
  transition:background .14s ease, color .14s ease;
}
.dex-tab.active {
  background:var(--primary);
  color:var(--on-primary);
}
.dex-grid {
  flex:1; width:100%;
  /* 넓은 화면에서는 좌우를 더 비워 내용이 가장자리에 붙지 않게 한다 */
  padding:3vh max(3vh, calc((100% - 1500px) / 2)) 5vh;
  overflow-y:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(17vh, 1fr));
  gap:2.2vh; align-content:start;
}
.dex-card {
  aspect-ratio:3/4;
  /* stretch 가 aspect-ratio 를 덮어써서 행 높이와 어긋나는 것을 막는다 */
  align-self:start;
  min-width:0; min-height:0;
  background:rgba(255,255,255,.06);
  border:1px solid var(--d-line-2); border-radius:var(--r);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:0.9vh; cursor:pointer; position:relative;
  transition:transform .14s ease, border-color .14s ease; overflow:hidden;
}
.dex-card:active { transform:scale(0.95); }
.dex-card:not(.locked) { border-color:var(--d-line); }
.dex-card.locked { border-color:rgba(255,255,255,.1); opacity:0.4; }
.dex-card.locked .dex-card-img { filter:brightness(0) opacity(0.45); }
/* height:% 는 aspect-ratio 로 정해지는 부모 높이를 참조해 순환 참조가 된다.
   flex 로 남는 높이를 나눠 갖게 해서 회피한다. */
.dex-card-img { width:100%; flex:1 1 0; min-height:0; object-fit:contain; border-radius:0.8vh; }
.dex-card-name {
  margin-top:0.6vh; font-size:1.75vh; color:var(--d-text); text-align:center;
  line-height:1.15; font-weight:700; flex:0 0 auto;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.dex-card.locked .dex-card-name { color:rgba(245,228,176,.35); }
.dex-card-count {
  position:absolute; top:0.6vh; right:0.6vh;
  background:var(--primary); color:var(--on-primary);
  font-size:1.5vh; padding:0.2vh 0.8vh;
  border-radius:99px; min-width:2.4vh; text-align:center;
  border:none; font-weight:800;
  font-family:'Nunito','Pretendard',sans-serif;
}

.dex-detail {
  position:fixed; inset:0; background:rgba(6,12,26,.9);
  display:none; align-items:center; justify-content:center; z-index:2000;
  backdrop-filter:blur(4px);
}
.dex-detail.show { display:flex; }
.dex-detail-card {
  background:var(--d-surface);
  border:0.4vh solid var(--d-gold); border-radius:var(--r-xl);
  padding:3vh; width:44vh; max-width:92vw;
  display:flex; flex-direction:column; align-items:center;
  position:relative;
  box-shadow: 0 0 6vh rgba(240,198,98,0.3);
  animation:revealPop 0.4s cubic-bezier(.16,1,.3,1);
}
.dex-detail-img { width:24vh; height:24vh; object-fit:contain; border-radius:var(--r); background:var(--d-bg-2); }
.dex-detail-name { font-size:3.6vh; color:var(--d-text); margin-top:1.5vh; font-weight:800; }
.dex-detail-dynasty { font-size:2.2vh; color:var(--d-text-2); margin-top:0.5vh; font-weight:500; }
.dex-detail-count {
  margin-top:2vh;
  background:var(--primary);
  color:var(--on-primary); padding:1vh 2vh; border-radius:99px;
  font-size:2.3vh; font-weight:800;
  font-family:'Nunito','Pretendard',sans-serif;
}
.dex-detail-close {
  position:absolute; top:1.5vh; right:1.5vh;
  width:4.5vh; height:4.5vh; border-radius:50%;
  background:rgba(255,255,255,.14); color:var(--d-text); border:none; cursor:pointer;
  font-size:2.3vh; font-weight:800;
}
.dex-detail-close:active { background:rgba(255,255,255,.24); }

/* ============== 사운드 토글 / 로딩 / 컨페티 ============== */
.sound-toggle {
  position:absolute; top:2.5vh; right:3vw;
  background:var(--surface); border:1px solid var(--line); color:var(--text);
  width:5.6vh; height:5.6vh; border-radius:50%;
  font-size:2.5vh; cursor:pointer;
  box-shadow:var(--sh-1); z-index:50;
  display:flex; align-items:center; justify-content:center;
}
.sound-toggle:active { transform:scale(.92); background:var(--surface-3); }
/* 짙은 화면 위에서는 반전 */
#screen-dex ~ .sound-toggle, .sound-toggle.on-dark {
  background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.2); color:var(--d-text);
}

.loading {
  position:fixed; inset:0;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:3vh; z-index:1000; color:var(--text);
}
.loading-mark { font-size:12vh; animation:machineFloat 2s ease-in-out infinite; }
.loading-text { font-size:2.4vh; letter-spacing:0; color:var(--text-2); font-weight:600; }

.confetti {
  position:fixed; width:1.5vh; height:1.5vh;
  pointer-events:none; z-index:200;
  animation:confettiFall 2s ease-out forwards;
}
@keyframes confettiFall {
  0% { transform:translateY(-10vh) rotate(0); opacity:1; }
  100% { transform:translateY(110vh) rotate(720deg); opacity:0; }
}

/* ============================================================
   폰 세로 화면 대응
   ============================================================
   원래 이 화면은 '패드 가로' 전용으로 짜였다. 모든 크기가 vh 기준이라
   세로 화면에서는 (vh 는 크고 vw 는 좁아서) 글자·버튼이 가로로 넘치고,
   html/body/#app 이 overflow:hidden 이라 넘친 부분이 잘려서 안 보였다.
   세로에서는 ① 세로 스크롤을 열고 ② 그리드를 1~2열로 줄이고
   ③ 크기 기준을 vh → vw 로 바꾼다. 가로(패드)는 건드리지 않는다. */
@media (orientation: portrait) {
  html, body { overflow-y:auto; overflow-x:hidden; }
  #app { height:auto; min-height:100vh; overflow:visible; }
  .screen {
    position:relative; inset:auto;
    min-height:100vh; height:auto;
    padding:2vh 4vw 4vh;
  }

  /* 헤더 */
  .header { min-height:auto; margin-bottom:3vw; gap:2vw; }
  .btn-back { width:11vw; height:11vw; font-size:5.5vw; border-width:0.5vw; }
  .stars-display {
    font-size:4.4vw; padding:1.4vw 3vw; min-width:18vw;
    gap:1.5vw; border-width:0.5vw;
  }

  /* 홈 */
  #screen-home { padding-top:15vw; }
  .home-top-bar { top:2vw; gap:2vw; flex-wrap:wrap; justify-content:center; width:92vw; }
  .home-action-btn { font-size:3.8vw; padding:1.4vw 3vw; gap:1.5vw; }
  .home-action-btn .badge { font-size:3.2vw; padding:0.4vw 1.5vw; min-width:6vw; }
  .home-title { font-size:6.4vw; }
  .home-subtitle { font-size:3.6vw; }
  .overall-progress { width:90vw; max-width:90vw; gap:2.5vw; margin-top:2.5vw; }
  .overall-progress-bar { height:3vw; }
  .overall-progress-text { font-size:3.4vw; }
  .reset-corner-btn { width:9vw; height:9vw; font-size:4.4vw; bottom:2vw; right:2vw; }

  /* 세션 카드: 2x2 → 1열 세로 나열 */
  .session-grid {
    grid-template-columns:1fr; grid-template-rows:none;
    max-width:92vw; max-height:none; flex:none;
    gap:2.5vw; margin-top:3vw;
  }
  .session-card { min-height:auto; padding:3vw 4vw; gap:4vw; border-width:0.7vw; }
  .session-emoji { font-size:12vw; }
  .session-name { font-size:4.8vw; }
  .session-sub  { font-size:3.3vw; }
  .session-progress-bar { height:2.2vw; }
  .session-progress-text { font-size:3vw; min-width:11vw; }

  .exam-start-btn { max-width:92vw; padding:3vw 4vw; gap:4vw; border-width:0.7vw; }
  .exam-start-emoji { font-size:9vw; }
  .exam-start-name  { font-size:4.8vw; }
  .exam-start-sub   { font-size:3.3vw; }

  /* 인트로 */
  .intro-emoji { font-size:26vw; margin-bottom:3vw; }
  .intro-text  { font-size:7vw; }
  .intro-hint  { font-size:4vw; margin-top:3vw; }

  /* 퀴즈 */
  .quiz-content { justify-content:flex-start; gap:5vw; padding-top:2vw; }
  .quiz-stars { font-size:5vw; }
  .question-box { min-width:0; width:92vw; padding:5vw 4vw; border-width:0.7vw; }
  .question-prompt { font-size:3.9vw; margin-bottom:3vw; }
  .question-content { font-size:22vw; }
  .question-content.text { font-size:13vw; }
  .question-content.sentence { font-size:5.4vw; line-height:1.45; }
  .question-image { height:auto; max-height:26vh; max-width:80vw; }
  .question-emoji-fallback { font-size:26vw; }

  /* 보기 4열 → 2열. JS 가 인라인 style 로 열 수를 넣어서 !important 필요 */
  .choices { grid-template-columns:repeat(2, 1fr) !important; width:92vw; gap:3vw; }
  .choice { min-height:20vw; font-size:9vw; padding:4vw 2vw; border-width:0.6vw; }
  .choice.text { font-size:5.6vw; }

  /* 스피킹 */
  .speak-word { font-size:11vw; }
  .speak-btns { gap:3vw; }
  .speak-hint { font-size:3.4vw; }

  /* 쓰기 */
  .writing-prompt { font-size:4.6vw; padding:2vw 4vw; }
  .writing-paper { width:94vw; height:22vh; max-width:94vw; }
  .writing-visual { min-height:16vh; }
  .writing-visual img { height:16vh; max-width:70vw; }
  .writing-visual .writing-emoji { font-size:13vh; }
  .writing-sentence { font-size:5vw; }
  .writing-buttons { gap:3vw; }

  /* 결과 · 시험 결과 · 부모 채점 */
  .result-box, .exam-result-box { max-width:94vw; padding:5vw 4vw; max-height:none; }
  .result-title { font-size:6.5vw; }
  .result-stars-icon { font-size:12vw; }
  .result-score { font-size:4.6vw; }
  .btn-action { font-size:4vw; padding:2.4vw 4vw; }
  .result-buttons { gap:3vw; margin-top:4vw; }
  .exam-grade-icon { font-size:16vw; }
  .exam-score { font-size:14vw; }
  .exam-grade-title { font-size:6vw; }
  .exam-detail, .exam-msg { font-size:3.9vw; }
  .exam-note-btn { font-size:3.8vw; padding:2.2vw 4vw; }
  .exam-note { max-height:40vh; }
  .exam-note-q { font-size:4vw; }
  .exam-note-ans { font-size:3.5vw; gap:4vw; }
  .grade-list { max-height:52vh; }
  .grade-word { font-size:5vw; }
  .grade-btns { gap:2vw; }
  .grade-btns button { font-size:3.5vw; padding:2vw 3vw; }

  /* 가챠 */
  .gacha-machine { width:56vw; height:56vw; font-size:28vw; border-width:1vw; }
  .gacha-pull-btn { font-size:5vw; padding:3vw 7vw; gap:2.5vw; border-width:0.7vw; }
  .gacha-info { font-size:3.6vw; }

  /* 도감 */
  .dex-title { font-size:5.4vw; }
  .dex-progress { font-size:3.8vw; }
  .dex-tab { font-size:3.6vw; }
  .dex-grid { grid-template-columns:repeat(auto-fill, minmax(26vw, 1fr)); gap:2.5vw; padding:3vw; }
  .dex-card-name { font-size:2.9vw; }
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="loading-mark">👑</div>
  <div class="loading-text">위인관을 열고 있어요…</div>
</div>

<button class="sound-toggle" id="soundToggle" aria-label="소리">🔊</button>

<div id="app">

  <!-- 홈 -->

// brother/sister/cousin: '사촌'은 생김새가 아니라 관계라서 그림 한 장으로 특정 불가.
// → 정답이 이 묶음에 속하면, 같은 묶음의 다른 단어는 오답 보기에서 제외한다.
const EXCLUSIVE_GROUPS = [
  ['brother', 'sister', 'cousin'],
  // ↓ 그림 모드에서 서로 겹쳐 보이는 묶음. 같이 내면 정답이 둘이 된다.
  ['bat', 'hit'],   // hit 그림(방망이를 휘두르는 아이) 안에 방망이가 그대로 들어있다
  ['cat', 'vet'],   // vet 그림(수의사) 안에 고양이가 앉아 있다
  ['sit', 'lap'],   // 둘 다 의자에 앉은 아이. 강조 표시 위치로만 다르다
  ['man', 'men']    // 단수/복수라 그림 한 장으로 구분시키기 어렵다
];
function conflictsWith(answer, other) {
  const a = String(answer || '').toLowerCase().trim();
  const b = String(other  || '').toLowerCase().trim();
  if (!a || !b || a === b) return false;
  return EXCLUSIVE_GROUPS.some(g => g.includes(a) && g.includes(b));
}

function getEmoji(word) {
  if (!word) return null;
  const lower = word.toLowerCase();
  if (EMOJI_MAP[lower]) return EMOJI_MAP[lower];
  const parts = lower.split(' ');
  if (parts.length === 2 && EMOJI_MAP[parts[1]]) return EMOJI_MAP[parts[1]];
  // 복수형(mail carriers, police officers …)은 단수로 한 번 더 시도
  if (lower.endsWith('s')) {
    const singular = lower.replace(/(?:ie)?s$/, m => m === 'ies' ? 'y' : '');
    if (singular !== lower) return getEmoji(singular);
  }
  return null;
}

// 같은 이모지를 쓰는 단어들 (bed/bedroom, sofa/living room, rabbit/bunny …)
// → 이 단어끼리는 서로 오답이 될 수 없다. 그림 하나에 정답이 둘이 되기 때문.
const SYNONYMS_BY_EMOJI = (() => {
  const m = {};
  for (const [w, e] of Object.entries(EMOJI_MAP)) (m[e] = m[e] || []).push(w);
  return m;
})();
function sameEmojiWords(word) {
  const e = getEmoji(word);
  if (!e) return [];
  const lower = (word || '').toLowerCase();
  return (SYNONYMS_BY_EMOJI[e] || []).filter(w => w !== lower);
}

function imageSlug(word) {
  return String(word || '').toLowerCase().trim().replace(/\s+/g, '_');
}
function imagePathFor(word) {
  const s = imageSlug(word);
  return s ? `단어이미지/${s}.png` : null;
}
// img 에 그림을 걸고, 파일이 없으면 이모지 fallback 으로 자동 전환
function showWordImage(imgEl, word, fallbackEl) {
  const src = imagePathFor(word);
  const emoji = getEmoji(word);
  if (!src) { imgEl.hidden = true; return false; }
  imgEl.onerror = () => {
    imgEl.hidden = true;
    if (fallbackEl && emoji) {
      fallbackEl.textContent = emoji;
      fallbackEl.hidden = false;
    }
  };
  imgEl.onload = () => {
    imgEl.hidden = false;
    if (fallbackEl) fallbackEl.hidden = true;
  };
  imgEl.alt = word;
  imgEl.src = src;
  return true;
}

let audioCtx = null, bgmNodes = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
  if (!soundOn) return;
  initAudio();
  const ctx = audioCtx, now = ctx.currentTime;
  if (type === 'correct') {
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + i*0.08);
      g.gain.linearRampToValueAtTime(0.2, now + i*0.08 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.01, now + i*0.08 + 0.2);
      o.connect(g).connect(ctx.destination);
      o.start(now + i*0.08); o.stop(now + i*0.08 + 0.3);
    });
  } else if (type === 'wrong') {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(220, now);
    o.frequency.linearRampToValueAtTime(110, now + 0.3);
    g.gain.setValueAtTime(0.1, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    o.connect(g).connect(ctx.destination);
    o.start(now); o.stop(now + 0.3);
  } else if (type === 'levelup') {
    [523.25, 587.33, 659.25, 698.46, 783.99, 880, 1046.5].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const t = now + i*0.06;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + 0.3);
    });
  } else if (type === 'tap') {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 700;
    g.gain.setValueAtTime(0.08, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    o.connect(g).connect(ctx.destination);
    o.start(now); o.stop(now + 0.1);
  } else if (type === 'complete') {
    const melody = [523, 659, 783, 1046, 783, 1046, 1318];
    melody.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const t = now + i*0.15;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + 0.35);
    });
  }
}
function startBGM() {
  if (!soundOn) return;
  initAudio(); stopBGM();
  const ctx = audioCtx;
  const master = ctx.createGain(); master.gain.value = 0.04; master.connect(ctx.destination);
  const notes = [261.63, 311.13, 349.23, 392.00, 466.16, 523.25, 466.16, 392.00];
  let step = 0;
  const interval = setInterval(() => {
    if (!soundOn || !bgmNodes) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = notes[step % notes.length];
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(1, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.8);
    step++;
  }, 600);
  bgmNodes = { interval, master };
}
function stopBGM() {
  if (bgmNodes) { clearInterval(bgmNodes.interval); bgmNodes.master.disconnect(); bgmNodes = null; }
}
document.getElementById('soundToggle').addEventListener('click', () => {
  soundOn = !soundOn;
  document.getElementById('soundToggle').textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) startBGM(); else stopBGM();
});
// ============================================================
// 음성 (TTS)
// ============================================================
// 브라우저는 getVoices() 를 비동기로 채운다. 목록이 비어 있을 때 speak() 하면
// 영어 목소리가 안 잡혀서 소리 없이 넘어간다 -> 목소리를 미리 잡아둔다.
let ttsVoice = null;
let ttsReady = false;
function pickVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = window.speechSynthesis.getVoices() || [];
  if (!vs.length) return;
  ttsVoice = vs.find(v => /^en[-_]US/i.test(v.lang) && !v.localService)
          || vs.find(v => /^en[-_]US/i.test(v.lang))
          || vs.find(v => /^en/i.test(v.lang))
          || null;
  ttsReady = true;
}
if ('speechSynthesis' in window) {
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}
// iPad/iPhone Safari 는 '사용자가 누른 순간'이 아니면 첫 발화를 막는다.
// 첫 터치 때 소리 없는 발화를 한 번 흘려보내 잠금을 풀어둔다.
let ttsUnlocked = false;
function unlockTTS() {
  if (ttsUnlocked || !('speechSynthesis' in window)) return;
  ttsUnlocked = true;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  } catch {}
  pickVoice();
}
function ttsAvailable() {
  return ('speechSynthesis' in window) && (ttsReady || (window.speechSynthesis.getVoices() || []).length > 0);
}
function speakWord(text) {
  if (!text || !('speechSynthesis' in window)) return false;
  try {
    const s = window.speechSynthesis;
    if (!ttsReady) pickVoice();
    s.cancel();
    // cancel() 직후 곧바로 speak() 하면 크롬에서 발화가 씹힌다. 한 틱 뒤에 건다.
    setTimeout(() => {
      try {
        const u = new SpeechSynthesisUtterance(String(text));
        if (ttsVoice) u.voice = ttsVoice;
        u.lang = (ttsVoice && ttsVoice.lang) || 'en-US';
        u.rate = 0.85; u.pitch = 1;
        s.speak(u);
        // 크롬이 간헐적으로 pause 상태로 멈추는 것 방지
        setTimeout(() => { try { if (s.paused) s.resume(); } catch {} }, 120);
      } catch {}
    }, 60);
    return true;
  } catch (e) { return false; }
}

function getSessionPool(sess) {
  return DATA.items.filter(it => sess.books.includes(it.book) && sess.filter(it));
}
// 한 번이라도 맞춘 문제 = 푼 문제 (별 지급 기준과 동일하게 맞춤)
function isSolved(p, id) { return (p[id]?.correct || 0) >= 1; }

function getSessionProgress(sess) {
  const pool = getSessionPool(sess);
  if (pool.length === 0) return { total: 0, learned: 0, percent: 0 };
  const p = loadProgress();
  const learned = pool.filter(it => isSolved(p, it.id)).length;
  return { total: pool.length, learned, percent: Math.round(learned / pool.length * 100) };
}

// 전체 완성도: 모든 세션 문제를 중복 없이 합친 기준
function getOverallProgress() {
  const ids = new Set();
  SESSIONS.forEach(sess => getSessionPool(sess).forEach(it => ids.add(it.id)));
  const p = loadProgress();
  let solved = 0;
  ids.forEach(id => { if (isSolved(p, id)) solved++; });
  const total = ids.size;
  return { total, solved, percent: total ? Math.round(solved / total * 100) : 0 };
}

// ============================================================
// 세션 시작 (인트로 → 퀴즈/쓰기)
// ============================================================
function pickSessionItems(sess, count = 10) {
  const pool = getSessionPool(sess);
  if (pool.length === 0) return [];
  const p = loadProgress();
  // 진행도 낮은 것 우선. correct 적을수록 우선. tie면 attempts 적은 것.
  const sorted = pool.slice().sort((a, b) => {
    const pa = p[a.id] || { attempts:0, correct:0 };
    const pb = p[b.id] || { attempts:0, correct:0 };
    if (pa.correct !== pb.correct) return pa.correct - pb.correct;
    return pa.attempts - pb.attempts;
  });
  // 상위 min(count*2, pool.length)에서 셔플 → count 선택 (약간의 다양성)
  const top = sorted.slice(0, Math.min(count * 2, sorted.length));
  shuffle(top);
  return top.slice(0, Math.min(count, top.length));
}

function startSession(sess) {
  currentSession = sess;
  // 서브모드 랜덤 고정 (있으면)
  if (sess.subModes && sess.subModes.length) {
    currentSubMode = sess.subModes[Math.floor(Math.random() * sess.subModes.length)];
  } else {
    currentSubMode = null;
  }
  // 인트로 준비
  const intro = currentSubMode?.intro || { emoji: sess.emoji, text: sess.name, hint: sess.sub };
  document.getElementById('introEmoji').textContent = intro.emoji;
  document.getElementById('introText').textContent = intro.text;
  document.getElementById('introHint').textContent = intro.hint;
  document.getElementById('introOverlay').classList.add('show');
  setTimeout(() => {
    document.getElementById('introOverlay').classList.remove('show');
    launchSession(sess);
  }, 1500);
}

function launchSession(sess) {
  if (sess.id === 'speaking') { clearSpeakClips(); stopSpeakStream(); }
  const items = pickSessionItems(sess, 10);
  if (items.length < (sess.id === 'sentence' ? 1 : 4)) {
    alert('아직 문제가 부족해요! 다른 세션을 골라봐요.');
    return;
  }
  quizItems = items;
  quizTotal = quizItems.length;
  quizIndex = 0;
  quizCorrect = 0;
  quizEarnedStars = 0;

  if (sess.kind === 'writing') {
    document.getElementById('writeQTotal').textContent = quizTotal;
    writingWords = quizItems.map(it => ({
      id: it.id, word: it.word,
      has_image: !!it.has_image,
      // 문장 빈칸 모드에서만 쓴다. 없으면 그림만 보고 쓰는 문제.
      template: sess.writeSentence ? (it.template || it.sentence || null) : null
    }));
    updateStarDisplay();
    showScreen('screen-writing');
    setupWritingCanvas();
    nextWritingQuestion();
    return;
  }
  document.getElementById('quizQTotal').textContent = quizTotal;
  updateStarDisplay();
  showScreen('screen-quiz');
  nextQuestion();
}

function retrySession() {
  if (!currentSession) { goHome(); return; }
  playSound('tap');
  startSession(currentSession);
}
function confirmQuit() {
  if (confirm('그만할래요?')) { playSound('tap'); goHome(); }
}

// ============================================================
// 오답 선택 (같은 unit > 같은 book > 아무데서나)
// ============================================================
function getWrongs(item, count, matchFn) {
  // matchFn(other): 오답으로 유효한지 (예: 이모지 있어야 함 등)
  // 정답과 '같이 내면 안 되는' 단어는 어느 단계에서도 오답으로 쓰지 않는다
  const ok = o => o.id !== item.id && !conflictsWith(item.word, o.word) && matchFn(o);
  const pools = [
    DATA.items.filter(o => ok(o) && o.book === item.book && o.unit === item.unit),
    DATA.items.filter(o => ok(o) && o.book === item.book),
    DATA.items.filter(o => ok(o))
  ];
  const chosen = [];
  const usedIds = new Set([item.id]);
  for (const pool of pools) {
    if (chosen.length >= count) break;
    const local = pool.filter(o => !usedIds.has(o.id));
    shuffle(local);
    for (const o of local) {
      if (chosen.length >= count) break;
      chosen.push(o); usedIds.add(o.id);
    }
  }
  return chosen;
}

// 퀴즈: 다음 문제

function nextQuestion() {
  if (quizIndex >= quizItems.length) {
    if (examMode) { showExamResult(); } else { showResult(); }
    return;
  }
  // 시험은 문항마다 유형이 다르다 ({item, mode}), 연습은 아이템 그대로.
  const entry = quizItems[quizIndex];
  const item = examMode ? entry.item : entry;
  if (examMode) currentSubMode = { id: entry.mode };

  document.getElementById('quizQNum').textContent = quizIndex + 1;
  document.getElementById('quizProgress').style.width = `${(quizIndex / quizTotal) * 100}%`;
  const qc = document.getElementById('questionContent');
  const qp = document.getElementById('questionPrompt');
  qc.style.cursor = ''; qc.onclick = null; qc.style.fontSize = '';
  // 문제마다 그림 슬롯 초기화 (안 그러면 앞 문제 그림이 남는다)
  const qi = document.getElementById('questionImage');
  const qf = document.getElementById('questionEmojiFallback');
  qi.onerror = null; qi.onload = null; qi.removeAttribute('src');
  qi.hidden = true; qf.hidden = true; qf.textContent = '';

  const sub = currentSubMode?.id;

  if (sub === 'speaking') { return renderSpeakingQuestion(item, qp, qc); }
  if (sub === 'speak_practice') { return renderSpeakPracticeQuestion(item, qp, qc); }
  if (sub === 'sentence') { return renderSentenceQuestion(item, qp, qc); }
  if (sub === 'first_sound')  { return renderFirstSoundQuestion(item, qp, qc); }
  if (sub === 'listen')       { return renderListenQuestion(item, qp, qc); }
  if (sub === 'family_to_word'){ return renderFamilyToWordQuestion(item, qp, qc); }
  if (sub === 'word_to_family'){ return renderWordToFamilyQuestion(item, qp, qc); }
  if (sub === 'image_to_word'){ return renderImageToWordQuestion(item, qp, qc); }
  if (sub === 'word_to_image'){ return renderWordToImageQuestion(item, qp, qc); }
  if (sub === 'word_to_emoji'){ return renderWordToEmojiQuestion(item, qp, qc); }
  // 기본: emoji_to_word
  return renderEmojiToWordQuestion(item, qp, qc);
}

function paintChoices(choices, item) {
  // 같은 내용의 버튼이 두 개 뜨는 것 방지 (정답을 먼저 남긴다)
  const seenDisplay = new Set();
  const unique = [];
  for (const c of [...choices].sort((a, b) => (b.correct ? 1 : 0) - (a.correct ? 1 : 0))) {
    if (seenDisplay.has(c.display)) continue;
    seenDisplay.add(c.display);
    unique.push(c);
  }
  choices = unique;
  currentCorrectAnswer = choices.find(c => c.correct).display;
  shuffle(choices);
  const el = document.getElementById('choices');
  el.innerHTML = '';
  el.style.gridTemplateColumns = `repeat(${Math.max(2, choices.length)}, 1fr)`;
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    // 정답 대조는 dataset 으로 한다. 그림 보기는 textContent 가 비어 있기 때문.
    btn.dataset.value = c.display;
    if (c.image) {
      btn.classList.add('img');
      const im = document.createElement('img');
      im.src = c.image; im.alt = c.display;
      // 그림이 없으면 단어 글자로 자동 대체 (문제가 깨지지 않게)
      im.onerror = () => { btn.classList.remove('img'); btn.classList.add('text'); btn.textContent = c.display; };
      btn.appendChild(im);
    } else {
      btn.textContent = c.display;
      // 라임 보기('-at')도 영문 폰트로 (하이픈 포함)
      if (/^[-a-zA-Z0-9\s]+$/.test(c.display)) btn.classList.add('text');
    }
    btn.addEventListener('click', () => {
      if (examMode) handleExamAnswer(btn, c.correct, item);
      else handleAnswer(btn, c.correct, item);
    });
    el.appendChild(btn);
  });
}

// 문제 그림: has_image 가 있으면 그림, 없으면 이모지.
// has_image 는 _sync_word_images.py 가 단어이미지/ 폴더를 훑어서 넣어준다.
function showQuestionVisual(item, qc, emoji) {
  if (item.has_image) {
    const qi = document.getElementById('questionImage');
    qi.alt = item.word;
    qi.src = imagePathFor(item.word);
    qi.hidden = false;
    qi.onerror = () => { qi.hidden = true; qc.textContent = emoji || ''; };
    qc.textContent = '';
    return true;
  }
  qc.textContent = emoji || '';
  return false;
}

function renderEmojiToWordQuestion(item, qp, qc) {
  const word = item.word;
  const emoji = getEmoji(word);
  qp.textContent = '무엇일까요?';
  qc.className = 'question-content';
  showQuestionVisual(item, qc, emoji);
  // 단어만 다른 게 아니라 '그림이 달라야' 오답이 된다 (🛏️ bed vs bedroom 같은 케이스 차단)
  const wrongs = getWrongs(item, 3, o => o.word && getEmoji(o.word) && getEmoji(o.word) !== emoji);
  const choices = [
    { display: word, value: word, correct: true },
    ...wrongs.map(o => ({ display: o.word, value: o.word, correct: false }))
  ];
  paintChoices(choices, item);
}
function renderWordToEmojiQuestion(item, qp, qc) {
  const word = item.word;
  const emoji = getEmoji(word);
  qp.textContent = '같은 그림은?';
  qc.textContent = word; qc.className = 'question-content text';
  const wrongs = getWrongs(item, 3, o => o.word && getEmoji(o.word) && getEmoji(o.word) !== emoji);
  const seen = new Set([emoji]);
  const wrongsMapped = [];
  for (const o of wrongs) {
    const e = getEmoji(o.word);
    if (!seen.has(e)) { wrongsMapped.push({ display:e, value:e, item:o }); seen.add(e); }
    if (wrongsMapped.length >= 3) break;
  }
  // 보기는 넷 다 그림이 있을 때만 그림으로. 그림과 이모지가 섞이면 보기 크기가 들쭉날쭉해진다.
  const allImg = item.has_image && wrongsMapped.every(w => w.item.has_image);
  const pic = o => allImg ? imagePathFor(o.word) : null;
  const choices = [
    { display: emoji, value: emoji, image: pic(item), correct: true },
    ...wrongsMapped.map(w => ({ display:w.display, value:w.value, image: pic(w.item), correct: false }))
  ];
  paintChoices(choices, item);
}
function renderFirstSoundQuestion(item, qp, qc) {
  const word = item.word;
  const emoji = getEmoji(word);
  const isUpper = Math.random() < 0.5;
  const firstL = isUpper ? word[0].toUpperCase() : word[0].toLowerCase();
  qp.textContent = isUpper ? '첫 글자는? (대문자)' : '첫 글자는? (소문자)';
  qc.className = 'question-content';
  showQuestionVisual(item, qc, emoji);
  const alpha = (isUpper ? 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' : 'abcdefghijklmnopqrstuvwxyz').split('');
  // 같은 그림을 다른 이름으로 읽으면(🐰 rabbit/bunny) 그 첫 글자도 정답이므로 오답에서 뺀다
  const alsoValid = new Set(
    sameEmojiWords(word)
      .map(w => (isUpper ? w[0].toUpperCase() : w[0].toLowerCase()))
  );
  const others = alpha.filter(l => l !== firstL && !alsoValid.has(l));
  shuffle(others);
  const wrongs = others.slice(0, 3).map(l => ({ display:l, value:l }));
  const choices = [
    { display: firstL, value: firstL, correct: true },
    ...wrongs.map(w => ({ ...w, correct: false }))
  ];
  paintChoices(choices, item);
}
// ---- 단어 가족 (book12 단모음 워크북) -------------------------------
// 이 두 유형은 그림을 쓰지 않는다. dig/win/sip 처럼 그릴 수 없는 단어가 대부분이라
// 라임(-at)과 단어의 관계 자체를 묻는다.
function renderFamilyToWordQuestion(item, qp, qc) {
  qp.textContent = `${item.family} 소리로 끝나는 단어는?`;
  qc.textContent = item.family; qc.className = 'question-content text';
  // ⚠️ 오답이 같은 라임이면 정답이 둘이 된다. 반드시 다른 라임에서만 뽑는다.
  const wrongs = getWrongs(item, 3, o => o.word && o.family && o.family !== item.family);
  const choices = [
    { display: item.word, value: item.word, correct: true },
    ...wrongs.map(o => ({ display: o.word, value: o.word, correct: false }))
  ];
  paintChoices(choices, item);
}
function renderWordToFamilyQuestion(item, qp, qc) {
  qp.textContent = '무슨 소리 가족일까요?';
  qc.textContent = item.word; qc.className = 'question-content text';
  const families = [...new Set(
    DATA.items.filter(o => o.book === item.book && o.family).map(o => o.family)
  )].filter(f => f !== item.family);
  shuffle(families);
  const choices = [
    { display: item.family, value: item.family, correct: true },
    ...families.slice(0, 3).map(f => ({ display: f, value: f, correct: false }))
  ];
  paintChoices(choices, item);
}

// 그림 ↔ 단어 (워크북의 Read and match 활동)
// 그림이 없는 항목(Ted/Meg 등)은 같은 뜻의 텍스트 모드로 대체한다.
function wfWrongs(item) {
  return getWrongs(item, 3, o => o.word && o.family
    && o.word.toLowerCase() !== item.word.toLowerCase());
}
function renderImageToWordQuestion(item, qp, qc) {
  if (!item.has_image) return renderFamilyToWordQuestion(item, qp, qc);
  qp.textContent = '무슨 그림일까요?';
  qc.textContent = ''; qc.className = 'question-content';
  const qi = document.getElementById('questionImage');
  qi.src = imagePathFor(item.word);
  qi.hidden = false;
  // 그림 파일이 없으면 라임 문제로 자동 강등 (보기가 단어라 그대로 성립한다)
  qi.onerror = () => {
    qi.hidden = true;
    qp.textContent = `${item.family} 소리로 끝나는 단어는?`;
    qc.textContent = item.family; qc.className = 'question-content text';
  };
  paintChoices([
    { display: item.word, correct: true },
    ...wfWrongs(item).map(o => ({ display: o.word, correct: false }))
  ], item);
}
function renderWordToImageQuestion(item, qp, qc) {
  if (!item.has_image) return renderWordToFamilyQuestion(item, qp, qc);
  qp.textContent = '같은 그림은?';
  qc.textContent = item.word; qc.className = 'question-content text';
  paintChoices([
    { display: item.word, image: imagePathFor(item.word), correct: true },
    ...wfWrongs(item).map(o => ({ display: o.word, image: imagePathFor(o.word), correct: false }))
  ], item);
}

function renderListenQuestion(item, qp, qc) {
  // 목소리가 없는 브라우저에서는 소리 없는 문제가 되어버린다 -> 첫 글자 문제로 대체
  if (!ttsAvailable()) return renderFirstSoundQuestion(item, qp, qc);
  const word = item.word;
  const emoji = getEmoji(word);
  qp.textContent = '잘 듣고 골라요! 🔊 (탭하면 다시 재생)';
  qc.textContent = '🔊'; qc.className = 'question-content';
  qc.style.cursor = 'pointer';
  qc.onclick = () => speakWord(word);
  const useE = !!emoji && Math.random() < 0.5;
  // 그림 보기일 때는 정답과 같은 그림을 쓰는 단어를 오답에서 제외하고, 오답끼리도 그림이 겹치지 않게 한다
  const wrongs = getWrongs(item, 3, o => o.word && o.word.toLowerCase() !== word.toLowerCase()
                            && (useE ? (!!getEmoji(o.word) && getEmoji(o.word) !== emoji) : true));
  const wrongsMapped = [];
  const seenDisp = new Set([useE ? emoji : word]);
  for (const o of wrongs) {
    const disp = useE ? getEmoji(o.word) : o.word;
    if (seenDisp.has(disp)) continue;
    seenDisp.add(disp);
    wrongsMapped.push({ display: disp, value: o.word });
    if (wrongsMapped.length >= 3) break;
  }
  const correctDisplay = useE ? emoji : word;
  const choices = [
    { display: correctDisplay, value: correctDisplay, correct: true },
    ...wrongsMapped.map(w => ({ ...w, correct: false }))
  ];
  paintChoices(choices, item);
  setTimeout(() => speakWord(word), 350);
}
function renderSentenceQuestion(item, qp, qc) {
  const answer = item.word;
  const template = item.template || item.sentence || '';
  const answerEmoji = getEmoji(answer);
  // "I have one ___." 처럼 문장만으로는 보기 전부가 정답이 되므로 그림으로 정답을 확정한다
  const pool = (item.answer_pool || []).filter(w =>
    w.toLowerCase() !== answer.toLowerCase() &&
    !(answerEmoji && getEmoji(w) === answerEmoji) &&  // 같은 그림으로 보이는 보기는 제외 (vet/doctor 등)
    !conflictsWith(answer, w)                          // 그림으로도 구분 안 되는 보기는 제외 (brother/cousin 등)
  );
  qp.textContent = '그림을 보고 빈칸에 알맞은 단어는?';
  qc.textContent = template; qc.className = 'question-content sentence';
  showWordImage(
    document.getElementById('questionImage'),
    answer,
    document.getElementById('questionEmojiFallback')
  );
  shuffle(pool);
  const wrongs = pool.slice(0, 3);
  // pool이 부족하면 같은 book의 다른 sentence_fill의 word로 채움
  if (wrongs.length < 3) {
    const extras = DATA.items
      .filter(o => o.id !== item.id && o.book === item.book && o.type === 'sentence_fill' && o.word
                   && o.word.toLowerCase() !== answer.toLowerCase() && !wrongs.includes(o.word)
                   && !(answerEmoji && getEmoji(o.word) === answerEmoji)
                   && !conflictsWith(answer, o.word))
      .map(o => o.word);
    shuffle(extras);
    while (wrongs.length < 3 && extras.length) wrongs.push(extras.shift());
  }
  const choices = [
    { display: answer, value: answer, correct: true },
    ...wrongs.map(w => ({ display: w, value: w, correct: false }))
  ];
  paintChoices(choices, item);
}

function handleAnswer(btn, isCorrect, item) {
  document.querySelectorAll('.choice').forEach(b => b.classList.add('disabled'));
  const result = updateItemProgress(item.id, isCorrect);
  if (isCorrect) {
    btn.classList.add('correct');
    quizCorrect++;
    playSound('correct');
    spawnConfetti(btn);
    // 별은 처음 맞춘 문제에만. 이미 푼 문제는 다시 안 줌.
    if (result.wasFirstCorrect) {
      addStars(1);
      quizEarnedStars += 1;
      showBonusToast('✨ 새로 배웠다! ⭐+1');
      flyStarTo(btn, '#quizStarsDisplay');
    } else {
      showBonusToast('👍 이미 배운 거야!');
    }

    });
    setTimeout(() => { quizIndex++; nextQuestion(); }, 1700);
  }
