// 4선 3칸 기준 위치. 위에서부터 윗줄 / 중간(점선) / 기준선 / 아랫줄.
// 대문자와 b d f h k l t 는 윗줄~기준선, a c e o 등은 중간~기준선,
// g j p q y 는 기준선 아래로 내려간다.
const WRITE_RULES = { top: 0.18, mid: 0.46, base: 0.74, desc: 0.94 };

function setupWritingCanvas() {
  const canvas = document.getElementById('writingCanvas');
  const guide = document.getElementById('writingGuideCanvas');
  const wrap = canvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  for (const c of [canvas, guide]) { c.width = rect.width; c.height = rect.height; }
  writingCtx = canvas.getContext('2d');
  writingCtx.strokeStyle = '#191F28';
  writingCtx.lineWidth = Math.max(6, rect.height * 0.045);
  writingCtx.lineCap = 'round';
  writingCtx.lineJoin = 'round';
  if (!canvas.dataset.bound) {
    canvas.dataset.bound = '1';
    const getPos = (e) => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {
        x: (t.clientX - r.left) * (canvas.width / r.width),
        y: (t.clientY - r.top)  * (canvas.height / r.height)
      };
    };
    const start = (e) => {
      e.preventDefault();
      writingDrawing = true;
      const p = getPos(e);
      writingCtx.beginPath(); writingCtx.moveTo(p.x, p.y);
    };
    const move = (e) => {
      if (!writingDrawing) return;
      e.preventDefault();
      const p = getPos(e);
      writingCtx.lineTo(p.x, p.y); writingCtx.stroke();
    };
    const end = (e) => { e.preventDefault(); writingDrawing = false; };
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end, { passive: false });
  }
}
// 줄과(필요하면) 글자를 그린다. alpha 0 이면 글자 없이 줄만.
function drawWritingPaper(word, alpha) {
  const c = document.getElementById('writingGuideCanvas');
  const g = c.getContext('2d');
  const W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);

  const yTop = H * WRITE_RULES.top;
  const yMid = H * WRITE_RULES.mid;
  const yBase = H * WRITE_RULES.base;
  const yDesc = H * WRITE_RULES.desc;
  const pad = W * 0.03;

  // 글자를 먼저 깔고 그 위에 줄을 그어야 줄이 가려지지 않는다.
  if (word && alpha > 0) {
    // 대문자 높이가 '윗줄~기준선' 에 딱 맞도록 실제 폰트 지표로 맞춘다.
    const target = yBase - yTop;
    let size = target * 1.4;
    g.font = `900 ${size}px Nunito, Pretendard, sans-serif`;
    const m = g.measureText('H');
    const cap = m.actualBoundingBoxAscent || size * 0.72;
    size = size * (target / cap);
    // 가로로 넘치면 줄인다
    g.font = `900 ${size}px Nunito, Pretendard, sans-serif`;
    const w = g.measureText(word).width;
    const maxW = W - pad * 2;
    if (w > maxW) size *= maxW / w;

    g.font = `900 ${size}px Nunito, Pretendard, sans-serif`;
    g.fillStyle = `rgba(25,31,40,${alpha})`;
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';
    g.letterSpacing = '0.08em';
    g.fillText(word, W / 2, yBase);
    g.letterSpacing = '0px';
  }

  // 줄: 윗줄·기준선은 실선, 중간은 점선, 아랫줄은 연한 실선
  g.lineWidth = Math.max(1.5, H * 0.008);
  g.strokeStyle = 'rgba(25,31,40,.28)';
  for (const y of [yTop, yBase]) {
    g.setLineDash([]);
    g.beginPath(); g.moveTo(pad, y); g.lineTo(W - pad, y); g.stroke();
  }
  g.strokeStyle = 'rgba(25,31,40,.16)';
  g.setLineDash([]);
  g.beginPath(); g.moveTo(pad, yDesc); g.lineTo(W - pad, yDesc); g.stroke();
  g.strokeStyle = 'rgba(25,31,40,.30)';
  g.setLineDash([H * 0.035, H * 0.035]);
  g.beginPath(); g.moveTo(pad, yMid); g.lineTo(W - pad, yMid); g.stroke();
  g.setLineDash([]);
}
function clearWritingCanvas() {
  playSound('tap');
  if (writingCtx) writingCtx.clearRect(0, 0, writingCtx.canvas.width, writingCtx.canvas.height);
}
// 문제 제시부: 그림(없으면 이모지). 문장 모드면 빈칸 문장까지.
function renderWritingVisual(entry) {
  const box = document.getElementById('writingVisual');
  box.innerHTML = '';
  const word = entry.word;

  if (entry.template) {
    const s = document.createElement('div');
    s.className = 'writing-sentence';
    const parts = String(entry.template).split(/_{2,}|___/);
    s.append(parts[0] || '');
    const blank = document.createElement('span');
    blank.className = 'blank';
    s.append(blank, parts.slice(1).join('') || '');
    box.appendChild(s);
  }

  if (entry.has_image) {
    const img = document.createElement('img');
    img.alt = word;
    img.src = imagePathFor(word);
    img.onerror = () => {
      img.remove();
      const e = getEmoji(word);
      if (e) {
        const span = document.createElement('span');
        span.className = 'writing-emoji';
        span.textContent = e;
        box.appendChild(span);
      }
    };
    box.appendChild(img);
  } else {
    const e = getEmoji(word);
    if (e) {
      const span = document.createElement('span');
      span.className = 'writing-emoji';
      span.textContent = e;
      box.appendChild(span);
    }
  }
}

function nextWritingQuestion() {
  if (quizIndex >= writingWords.length) { showResult(); return; }
  const entry = writingWords[quizIndex];
  document.getElementById('writeQNum').textContent = quizIndex + 1;
  document.getElementById('writeProgress').style.width = `${(quizIndex / quizTotal) * 100}%`;
  document.getElementById('writingPrompt').textContent =
    entry.template ? '빈칸에 들어갈 단어를 써봐!' : '그림을 보고 써봐!';

  writingRevealed = false;
  writingHinted = false;
  renderWritingVisual(entry);
  clearWritingCanvas();
  drawWritingPaper(entry.word, 0);

  document.getElementById('writingButtons').hidden = false;
  document.getElementById('writingJudge').hidden = true;
  const hintBtn = document.getElementById('writingHintBtn');
  hintBtn.hidden = false;
  hintBtn.textContent = '💡 힌트';
}

function toggleWritingHint() {
  if (writingRevealed) return;
  playSound('tap');
  writingHinted = !writingHinted;
  const w = writingWords[quizIndex].word;
  drawWritingPaper(w, writingHinted ? 0.16 : 0);
  document.getElementById('writingHintBtn').textContent =
    writingHinted ? '🙈 힌트 끄기' : '💡 힌트';
}
// 다 썼으면 정답을 줄 위에 겹쳐 보여준다. 내가 쓴 글씨(검정)와 바로 비교된다.
function revealWritingAnswer() {
  if (!writingCtx || writingRevealed) return;
  const canvas = writingCtx.canvas;
  const px = writingCtx.getImageData(0, 0, canvas.width, canvas.height).data;
  let drawn = 0;
  for (let i = 3; i < px.length; i += 16) if (px[i] > 0) drawn++;
  if (drawn < 30) {
    playSound('wrong');
    showBonusToast('✏️ 아직 안 썼어요!');
    return;
  }
  playSound('tap');
  writingRevealed = true;
  drawWritingPaper(writingWords[quizIndex].word, 0.34);
  document.getElementById('writingButtons').hidden = true;
  document.getElementById('writingJudge').hidden = false;
}

function judgeWriting(ok) {
  if (!writingRevealed) return;
  const entry = writingWords[quizIndex];
  const btn = (typeof event !== 'undefined' && event) ? event.target : null;

  if (!ok) {
    playSound('tap');
    writingRevealed = false;
    writingHinted = false;
    clearWritingCanvas();
    drawWritingPaper(entry.word, 0);
    document.getElementById('writingJudge').hidden = true;
    document.getElementById('writingButtons').hidden = false;
    document.getElementById('writingHintBtn').textContent = '💡 힌트';
    return;
  }

  playSound('correct');
  quizCorrect++;
  const res = updateItemProgress(entry.id, true);
  if (btn) spawnConfetti(btn);
  // 별은 처음 맞춘 문제에만. 이미 푼 문제는 다시 안 줌.
  if (res.wasFirstCorrect) {
    addStars(1);
    quizEarnedStars += 1;
    showBonusToast('✨ 새로 배웠다! ⭐+1');
    if (btn) flyStarTo(btn, '#writeStarsDisplay');
  } else {
    showBonusToast('👍 이미 배운 거야!');
  }
  document.getElementById('writingJudge').hidden = true;
  setTimeout(() => { quizIndex++; nextWritingQuestion(); }, 900);
}

// ============================================================
// 스피킹 문제 (부모 확인 채점)
// ============================================================
// 정답/오답을 앱이 판단하지 않는다. 아이 목소리를 녹음해두고,
// 시험이 끝나면 부모가 들어보고 ⭕/❌ 를 누른다.
let speakRecorder = null;      // MediaRecorder
let speakChunks = [];
let speakStream = null;
let speakClipUrls = [];        // 이번 시험에서 만든 blob URL (다음 시험 시작 때 정리)

function clearSpeakClips() {
  speakClipUrls.forEach(u => { try { URL.revokeObjectURL(u); } catch {} });
  speakClipUrls = [];
}
function stopSpeakStream() {
  if (speakStream) { speakStream.getTracks().forEach(t => t.stop()); speakStream = null; }
  speakRecorder = null; speakChunks = [];
}

// 말할 거리: 문장 문항이면 빈칸을 채운 완성 문장, 아니면 단어 하나
function speakingPrompt(item) {
  const tpl = item.template || item.sentence || '';
  if (tpl && item.word && tpl.includes('___')) return tpl.replace(/_{2,}/, item.word);
  if (tpl && !tpl.includes('___')) return tpl;
  return item.word;
}
// 녹음이 가능한 환경인가? http:// (localhost 제외) 에서는 브라우저가 마이크를 막는다.
function canRecord() {
  return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

// 말하기 연습 — 시험이 아니므로 원어민 듣기도, 내 목소리 다시 듣기도 허용한다.
// 발음 정오는 앱이 판단하지 않는다. 끝까지 말해본 것 자체를 인정해서 별을 준다.
function renderSpeakPracticeQuestion(item, qp, qc) {
  const say = speakingPrompt(item);
  qp.textContent = '문장을 소리내어 읽어봐! 🎤';
  qc.className = 'question-content';
  showQuestionVisual(item, qc, getEmoji(item.word) || '🗣️');

  const el = document.getElementById('choices');
  el.style.gridTemplateColumns = '1fr';
  el.innerHTML = `
    <div class="speak-box">
      <div class="speak-word sentence">${say}</div>
      <div class="speak-btns">
        <button class="btn-action" id="spListen">🔊 들어보기</button>
        <button class="btn-action primary" id="spMic">🎤 눌러서 말하기</button>
        <button class="btn-action" id="spPlay" hidden>▶ 내 목소리</button>
        <button class="btn-action primary" id="spNext" hidden>➡️ 다음</button>
      </div>
      <div class="speak-hint${canRecord() ? '' : ' warn'}" id="spHint">${
        canRecord() ? '🔊 먼저 듣고, 🎤 눌러서 따라 말해봐!'
                    : '🔊 듣고 따라 말해봐! (이 주소에서는 녹음이 안 돼요)'
      }</div>
    </div>`;

  const $ = id => document.getElementById(id);
  const hint = $('spHint');
  let recording = false, myClip = null;

  $('spListen').onclick = () => speakWord(say);

  const done = () => {
    // 말하기는 정오 판정이 없다. 끝까지 해낸 것을 '맞춤'으로 기록한다.
    const r = updateItemProgress(item.id, true);
    quizCorrect++;
    playSound('correct');
    if (r.wasFirstCorrect) {
      addStars(1); quizEarnedStars += 1;
      showBonusToast('✨ 잘 말했어! ⭐+1');
      flyStarTo($('spNext') || $('spMic'), '#quizStarsDisplay');
    } else {
      showBonusToast('👍 또 연습했구나!');
    }
    setTimeout(() => { quizIndex++; nextQuestion(); }, 700);
  };
  $('spNext').onclick = done;

  const afterRecord = () => {
    const blob = speakChunks.length ? new Blob(speakChunks, { type: speakChunks[0].type || 'audio/webm' }) : null;
    if (blob && blob.size > 0) {
      myClip = URL.createObjectURL(blob);
      speakClipUrls.push(myClip);
      $('spPlay').hidden = false;
      $('spPlay').onclick = () => new Audio(myClip).play().catch(() => {});
      hint.textContent = '▶ 내 목소리를 들어보고, 원어민이랑 비교해봐!';
    } else {
      hint.textContent = '잘했어! ➡️ 다음으로 넘어가자';
    }
    stopSpeakStream();
    $('spMic').hidden = true;
    $('spNext').hidden = false;
  };

  $('spMic').onclick = async () => {
    if (!recording) {
      recording = true;
      $('spMic').textContent = '✅ 다 말했어요!';
      $('spMic').classList.add('recording');
      hint.textContent = '🔴 듣고 있어요… 다 말하면 눌러!';
      try {
        speakStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        speakChunks = [];
        speakRecorder = new MediaRecorder(speakStream);
        speakRecorder.ondataavailable = e => { if (e.data.size) speakChunks.push(e.data); };
        speakRecorder.start();
      } catch {
        speakStream = null; speakRecorder = null;
        hint.textContent = '🎤 (녹음은 안 되지만 그냥 말해도 돼!)';
      }
      return;
    }
    $('spMic').classList.remove('recording');
    $('spMic').disabled = true;
    if (speakRecorder && speakRecorder.state === 'recording') {
      speakRecorder.onstop = afterRecord;
      speakRecorder.stop();
    } else {
      afterRecord();
    }
  };
}

function renderSpeakingQuestion(item, qp, qc) {
  const word = item.word;
  const say = speakingPrompt(item);
  const isSentence = say !== word;
  qp.textContent = isSentence ? '문장을 큰 소리로 읽어봐! 🎤' : '큰 소리로 말해봐! 🎤';
  qc.className = 'question-content';
  showQuestionVisual(item, qc, getEmoji(word) || '🗣️');

  const el = document.getElementById('choices');
  el.innerHTML = '';
  el.style.gridTemplateColumns = '1fr';
  el.innerHTML = `
    <div class="speak-box">
      <div class="speak-word${isSentence ? ' sentence' : ''}" id="speakWord">${say}</div>
      <div class="speak-btns">
        ${examMode ? '' : '<button class="btn-action" id="speakListenBtn">🔊 들어보기</button>'}
        <button class="btn-action primary" id="speakMicBtn">🎤 눌러서 말하기</button>
      </div>
      <div class="speak-hint${canRecord() ? '' : ' warn'}" id="speakHint">${
        !canRecord() ? '⚠️ 이 주소에서는 녹음이 안 됩니다 — https 주소로 접속하세요'
        : examMode  ? '읽고 말해봐! 채점은 엄마·아빠가 해요'
                    : '먼저 🔊 눌러서 들어봐도 돼!'
      }</div>
    </div>`;

  // 시험에서는 정답을 미리 들려주지 않는다 (듣고 따라 하면 시험이 아니다)
  const lb = document.getElementById('speakListenBtn');
  if (lb) lb.onclick = () => speakWord(say);

  const micBtn = document.getElementById('speakMicBtn');
  const hint = document.getElementById('speakHint');
  let recording = false;

  const finish = () => {
    const blob = speakChunks.length ? new Blob(speakChunks, { type: speakChunks[0].type || 'audio/webm' }) : null;
    let url = null;
    if (blob && blob.size > 0) { url = URL.createObjectURL(blob); speakClipUrls.push(url); }
    stopSpeakStream();
    // 채점은 부모가. correct=null 로 남겨두면 결과 화면에서 채점 화면이 먼저 뜬다.
    examLog.push({ item, mode: 'speaking', picked: '🎤 녹음', answer: say, correct: null, clip: url });
    setTimeout(() => { quizIndex++; nextQuestion(); }, 250);
  };

  micBtn.onclick = async () => {
    if (!recording) {
      recording = true;
      micBtn.textContent = '✅ 다 말했어요!';
      micBtn.classList.add('recording');
      hint.textContent = '🔴 듣고 있어요… 다 말하면 눌러!';
      // 녹음은 '있으면 좋은' 기능. 안 되면 그냥 녹음 없이 진행한다.
      try {
        speakStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        speakChunks = [];
        speakRecorder = new MediaRecorder(speakStream);
        speakRecorder.ondataavailable = e => { if (e.data.size) speakChunks.push(e.data); };
        speakRecorder.start();
      } catch {
        speakStream = null; speakRecorder = null;
        hint.textContent = '🎤 (녹음은 안 되지만 그냥 말해도 돼!)';
      }
      return;
    }
    // 두 번째 탭 = 말하기 끝
    micBtn.disabled = true;
    micBtn.classList.remove('recording');
    if (speakRecorder && speakRecorder.state === 'recording') {
      speakRecorder.onstop = finish;
      speakRecorder.stop();
    } else {
      finish();
    }
  };
}

// ============================================================
// 시험 모드
// ============================================================
function examPoolFor(mode) {
  const sess = SESSIONS.find(s => s.id === EXAM_MODE_SOURCE[mode]);
  return sess ? getSessionPool(sess) : [];
}

// mix 대로 뽑되, 풀이 모자란 유형은 남는 유형이 대신 채운다.
function buildExamQuestions() {
  const used = new Set();
  const qs = [];
  const take = (mode, n) => {
    const pool = examPoolFor(mode).filter(it => !used.has(it.id));
    shuffle(pool);
    for (const it of pool.slice(0, n)) { used.add(it.id); qs.push({ item: it, mode }); }
  };
  EXAM.mix.forEach(m => take(m.mode, m.count));
  // 모자라면 다른 유형으로 보충
  if (qs.length < EXAM.total) {
    for (const m of EXAM.mix) {
      if (qs.length >= EXAM.total) break;
      take(m.mode, EXAM.total - qs.length);
    }
  }
  shuffle(qs);
  return qs.slice(0, EXAM.total);
}

function startExam() {
  playSound('tap');
  const qs = buildExamQuestions();
  if (qs.length < 4) { alert('아직 시험 볼 문제가 부족해요!'); return; }
  // 녹음이 안 되는 주소면 시험 '시작 전에' 알린다.
  // 채점 화면에서야 알게 되면 아이가 이미 다 말한 뒤라 되돌릴 수 없다.
  if (qs.some(q => q.mode === 'speaking') && !canRecord()) {
    const go = confirm(
      '⚠️ 이 주소에서는 말하기 녹음이 안 됩니다.\n' +
      '(브라우저는 https 또는 localhost 에서만 마이크를 허용합니다)\n\n' +
      '지금 주소: ' + location.origin + '\n\n' +
      '녹음해서 채점하시려면 https:// 주소로 다시 접속하세요.\n\n' +
      '[확인] 녹음 없이 그냥 시험 보기\n[취소] 나가서 주소 바꾸기'
    );
    if (!go) return;
  }
  currentSession = null;
  examMode = true;
  clearSpeakClips();
  stopSpeakStream();
  examLog = [];
  quizItems = qs;
  quizTotal = qs.length;
  quizIndex = 0;
  quizCorrect = 0;
  quizEarnedStars = 0;

  document.getElementById('introEmoji').textContent = '📝';
  document.getElementById('introText').textContent = '시험 보기';
  document.getElementById('introHint').textContent =
    `${quizTotal}문제 · 끝까지 풀면 점수가 나와요!`;
  document.getElementById('introOverlay').classList.add('show');
  setTimeout(() => {
    document.getElementById('introOverlay').classList.remove('show');
    document.getElementById('quizQTotal').textContent = quizTotal;
    document.getElementById('quizStarsDisplay').hidden = true;  // 시험 중엔 별 안 보임
    showScreen('screen-quiz');
    nextQuestion();
  }, 1800);
}

// 시험은 정답/오답을 즉시 알려주지 않는다. 기록만 하고 넘어감.
function handleExamAnswer(btn, isCorrect, item) {
  document.querySelectorAll('.choice').forEach(b => b.classList.add('disabled'));
  btn.classList.add('picked');
  playSound('tap');
  // 진행도(완성도)에는 반영. 별은 시험 끝나고 등급으로만 준다.
  updateItemProgress(item.id, isCorrect);
  if (isCorrect) quizCorrect++;
  examLog.push({
    item, mode: currentSubMode?.id,
    picked: btn.textContent,
    answer: currentCorrectAnswer,
    correct: isCorrect
  });
  setTimeout(() => { quizIndex++; nextQuestion(); }, 350);
}

function gradeFor(percent) {
  return EXAM.grades.find(g => percent >= g.min) || EXAM.grades[EXAM.grades.length - 1];
}

// 스피킹 문항이 남아 있으면 부모 채점 화면을 먼저 띄운다
function showParentGrading() {
  const box = document.getElementById('gradeList');
  box.innerHTML = '';
  examLog.forEach((e, i) => {
    if (e.correct !== null) return;
    const row = document.createElement('div');
    row.className = 'grade-row';
    row.innerHTML = `
      <div class="grade-word">${(e.answer||'').includes(' ') ? '' : (getEmoji(e.answer) || '🗣️') + ' '}${e.answer}</div>
      <div class="grade-btns">
        ${e.clip ? `<button class="grade-play" data-i="${i}">▶ 아이 목소리</button>`
                  : `<button class="grade-play" disabled>🚫 녹음 없음 (https 주소로 접속해야 녹음됩니다)</button>`}
        <button class="grade-say" data-i="${i}">🔊 원어민</button>
        <button class="grade-ok"  data-i="${i}">⭕ 맞음</button>
        <button class="grade-no"  data-i="${i}">❌ 틀림</button>
      </div>`;
    box.appendChild(row);
  });

  box.querySelectorAll('.grade-play').forEach(b => b.onclick = () => {
    const e = examLog[+b.dataset.i];
    if (e.clip) new Audio(e.clip).play().catch(() => {});
  });
  box.querySelectorAll('.grade-say').forEach(b => b.onclick = () => {
    speakWord(examLog[+b.dataset.i].answer);
  });
  const mark = (i, val, row) => {
    examLog[i].correct = val;
    row.classList.add(val ? 'graded-ok' : 'graded-no');
    row.querySelectorAll('button').forEach(x => x.disabled = true);
    if (!examLog.some(e => e.correct === null)) {
      document.getElementById('gradeDoneBtn').hidden = false;
    }
  };
  box.querySelectorAll('.grade-ok').forEach(b => b.onclick = () => mark(+b.dataset.i, true,  b.closest('.grade-row')));
  box.querySelectorAll('.grade-no').forEach(b => b.onclick = () => mark(+b.dataset.i, false, b.closest('.grade-row')));

  document.getElementById('gradeDoneBtn').hidden = true;
  showScreen('screen-parent-grading');
}

function finishParentGrading() {
  playSound('tap');
  // 부모가 맞다고 한 것만 진행도/정답에 반영
  examLog.filter(e => e.mode === 'speaking').forEach(e => {
    updateItemProgress(e.item.id, e.correct === true);
    if (e.correct === true) quizCorrect++;
  });
  showExamResult();
}

function showExamResult() {
  if (examLog.some(e => e.correct === null)) { showParentGrading(); return; }
  const percent = Math.round(quizCorrect / quizTotal * 100);
  const g = gradeFor(percent);
  addStars(g.stars);
  quizEarnedStars = g.stars;

  document.getElementById('examGradeIcon').textContent = g.icon;
  document.getElementById('examScore').textContent = `${percent}점`;
  document.getElementById('examGradeTitle').textContent = g.title;
  document.getElementById('examDetail').textContent =
    `${quizTotal}문제 중 ${quizCorrect}개 정답 · ${quizTotal - quizCorrect}개 틀림`;
  document.getElementById('examMsg').textContent = g.msg;
  document.getElementById('examEarned').textContent = `+${g.stars}`;

  const wrongs = examLog.filter(e => !e.correct);
  const noteBtn = document.getElementById('examNoteBtn');
  noteBtn.hidden = wrongs.length === 0;
  noteBtn.textContent = `📕 틀린 문제 ${wrongs.length}개 보기`;
  renderExamNote(wrongs);
  document.getElementById('examNote').hidden = true;

  playSound('complete');
  examMode = false;
  document.getElementById('quizStarsDisplay').hidden = false;
  updateStarDisplay();
  showScreen('screen-exam-result');
}

// 오답노트 한 줄에 넣을 '문제' 표현 (유형마다 다름)
function examQuestionLabel(e) {
  const w = e.item.word;
  if (e.mode === 'sentence') {
    return e.item.template || e.item.sentence || w || '';
  }
  if (e.mode === 'word_to_emoji') return w;
  if (e.mode === 'first_sound') return `${getEmoji(w) || ''} ${w || ''} — 첫 글자`.trim();
  return `${getEmoji(w) || ''} ${w || ''}`.trim();
}

function renderExamNote(wrongs) {
  const box = document.getElementById('examNoteList');
  box.innerHTML = '';
  wrongs.forEach(e => {
    const row = document.createElement('div');
    row.className = 'exam-note-row';
    row.innerHTML = `
      <div class="exam-note-q">${examQuestionLabel(e)}</div>
      <div class="exam-note-ans">
        <span class="mine">내 답 ${e.picked}</span>
        <span class="right">정답 ${e.answer}</span>
      </div>`;
    box.appendChild(row);
  });
}

function toggleExamNote() {
  playSound('tap');
  const n = document.getElementById('examNote');
  n.hidden = !n.hidden;
}

function retryExam() { startExam(); }

// ============================================================
// 결과
// ============================================================
function showResult() {
  document.getElementById('resultScore').textContent = `${quizCorrect} / ${quizTotal} 정답!`;
  let s = 0;
  if (quizCorrect === quizTotal) s = 3;
  else if (quizCorrect >= quizTotal * 0.7) s = 2;
  else if (quizCorrect >= quizTotal * 0.4) s = 1;
  document.getElementById('resultStarsIcon').textContent = '⭐'.repeat(s) + '☆'.repeat(3 - s);
  document.getElementById('resultEarned').textContent = `+${quizEarnedStars}`;
  playSound('complete');
  showScreen('screen-result');
}

// ============================================================
// 가챠
// ============================================================
const GACHA_COST = 5;
const GACHA_REFUND = 3;
function openGacha() {
  playSound('tap');
  updateStarDisplay();
  document.getElementById('gachaPullBtn').disabled = loadStars() < GACHA_COST;
  showScreen('screen-gacha');
}
function rollGacha() { return FIGURES[Math.floor(Math.random() * FIGURES.length)]; }
function pullGacha() {
  if (loadStars() < GACHA_COST) { playSound('wrong'); return; }
  playSound('tap');
  spendStars(GACHA_COST); updateStarDisplay();
  const machine = document.getElementById('gachaMachine');
  machine.classList.add('shaking');
  document.getElementById('gachaPullBtn').disabled = true;
  setTimeout(() => {
    machine.classList.remove('shaking');
    const card = rollGacha();
    const result = addCard(card.id);
    let refunded = 0;
    if (!result.isNew) { refunded = GACHA_REFUND; addStars(refunded); }
    showCardReveal(card, result, refunded);
    setTimeout(() => {
      document.getElementById('gachaPullBtn').disabled = loadStars() < GACHA_COST;
      updateStarDisplay();
    }, 100);
  }, 1200);
}
function showCardReveal(card, result, refunded) {
  const el = document.getElementById('cardReveal');
  let statusHTML = result.isNew
    ? '<div class="reveal-status new">✨ NEW! ✨</div>'
    : `<div class="reveal-status dup">중복 (${result.count}장)</div>`;
  if (refunded > 0) statusHTML += `<div class="reveal-refund">⭐ 별 ${refunded}개 돌려받았어요!</div>`;
  el.innerHTML = `
    <div class="reveal-card">
      <img class="reveal-img" src="${card.image}" alt="${card.name}" onerror="this.style.display='none'">
      <div class="reveal-status-group">${statusHTML}</div>
      <div class="reveal-tap-hint">탭하면 닫혀요</div>
    </div>
  `;
  document.getElementById('cardRevealOverlay').classList.add('show');
  playSound(result.isNew ? 'levelup' : 'correct');
}
function closeCardReveal() { document.getElementById('cardRevealOverlay').classList.remove('show'); }

// ============================================================
// 도감
// ============================================================
function openDex() {
  playSound('tap');
  currentDexTab = 'all';
  renderDexTabs(); renderDex();
  showScreen('screen-dex');
}
function renderDexTabs() {
  const el = document.getElementById('dexTabs');
  const tabs = [{ key:'all', label:'전체' }, ...DYNASTIES.map(d => ({ key: d.key, label: `${d.emoji} ${d.key}` }))];
  el.innerHTML = tabs.map(t =>
    `<button class="dex-tab ${t.key === currentDexTab ? 'active' : ''}" onclick="switchDexTab('${t.key}')">${t.label}</button>`
  ).join('');
}
function switchDexTab(key) { playSound('tap'); currentDexTab = key; renderDexTabs(); renderDex(); }
function renderDex() {
  const grid = document.getElementById('dexGrid');
  const cards = loadCards();
  const filtered = currentDexTab === 'all' ? FIGURES : FIGURES.filter(f => f.dynasty === currentDexTab);
  grid.innerHTML = filtered.map(f => {
    const count = cards[f.id] || 0;
    const owned = count > 0;
    return `
      <div class="dex-card ${owned ? '' : 'locked'}" onclick="showDexDetail('${f.id}')">
        ${owned && count > 1 ? `<div class="dex-card-count">${count}</div>` : ''}
        <img class="dex-card-img" src="${f.image}" alt="${f.name}" onerror="this.style.display='none'">
        <div class="dex-card-name">${owned ? f.name : '???'}</div>
      </div>
    `;
  }).join('');
  document.getElementById('dexProgress').textContent = `${getOwnedCount()}/${FIGURES.length}`;
}
function showDexDetail(id) {
  const f = FIGURES.find(x => x.id === id);
  if (!f) return;
  const count = getCardCount(id);
  if (count === 0) { playSound('wrong'); return; }
  playSound('tap');
  document.getElementById('dexDetailCard').innerHTML = `
    <button class="dex-detail-close" onclick="closeDexDetail()">✕</button>
    <img class="dex-detail-img" src="${f.image}" alt="${f.name}" onerror="this.style.display='none'">
    <div class="dex-detail-name">${f.name}</div>
    <div class="dex-detail-dynasty">${f.dynastyEmoji} ${f.dynasty}</div>
    <div class="dex-detail-count">×${count}장</div>
  `;
  document.getElementById('dexDetail').classList.add('show');
}
function closeDexDetail(event) {
  if (event && event.target.id !== 'dexDetail' && event.target.className !== 'dex-detail-close') return;
  document.getElementById('dexDetail').classList.remove('show');
}

// ============================================================
// 초기화
// ============================================================
function confirmReset() {
  playSound('tap');
  if (!confirm('시즌2 진행/별/카드를 모두 초기화할까요?\n(시즌1은 영향 없음)')) return;
  if (!confirm('진짜요? 되돌릴 수 없어요!')) return;
  localStorage.removeItem(KEYS.progress);
  localStorage.removeItem(KEYS.stars);
  localStorage.removeItem(KEYS.cards);
  updateStarDisplay();
  renderHome();
  alert('시즌2 초기화 완료!');
}

async function init() {
  try {
    const res = await fetch('english_textbooks.json');
    DATA = await res.json();
  } catch (e) {
    alert('데이터 불러오기 실패: ' + e.message);
    return;
  }
  document.getElementById('loading').style.display = 'none';
  renderHome();
  document.addEventListener('click', () => {
    if (soundOn && !bgmNodes) startBGM();
    unlockTTS();
  }, { once: true });
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

init();
